<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Bruna Gripp</title>
<meta name="description" content="Plano alimentar no celular: marque as refeições, reorganize o dia e troque alimentos com equivalência.">
<meta name="theme-color" content="#FAF7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151213" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bruna Gripp">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Team Bruna Gripp — direção (unslop): acolhedor, prazeroso, exato.
   Mundo: mesa posta e consultório. Superfícies neutras e quentes; o vinho da marca é o acento (botão principal, seleção).
   Bege e marrom só nos momentos: o cartão do dia e os dois pratos do conversor.
   Assinatura: a refeição feita vira o coração da marca. Grid de 4 px. */
:root{
  --bg:#FAF7F5; --surface:#FFFFFF; --raise:#F3EEEB; --seg-on:#FFFFFF;
  --ink:#1F1A1C; --ink2:#5A5155; --muted:#7A7074;
  --line:rgba(31,26,28,.08); --line2:rgba(31,26,28,.16);
  --accent:#9B4A63; --accent-ink:#FFFFFF; --accent-soft:#F4E8EC;
  --btn:#9B4A63; --btn-ink:#FFFFFF;
  --fill:#F6F2EF; --fill-line:rgba(31,26,28,.12);
  --moment:#F3E7EA; --moment-line:rgba(155,74,99,.14); --bege:#DCC3A3; --bege-2:#EBDCC8; --marrom:#634A53;
  --good:#2F7A55; --good-bg:#E6F2EB; --warn:#8A5A12; --warn-bg:#FAF1E2; --bad:#B3261E;
  --water:#5E86AD; --track:rgba(99,74,83,.14);
  --shadow:0 1px 2px rgba(60,30,40,.05);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --ease:cubic-bezier(0.22,1,0.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151213; --surface:#1C1819; --raise:#272123; --seg-on:#332B2E;
  --ink:#EFE9EB; --ink2:#B5ABAF; --muted:#90868A;
  --line:rgba(239,233,235,.08); --line2:rgba(239,233,235,.16);
  --accent:#D88BA2; --accent-ink:#1E1115; --accent-soft:#33232A;
  --btn:#D88BA2; --btn-ink:#1E1115;
  --fill:#221D1F; --fill-line:rgba(239,233,235,.12);
  --moment:#271C21; --moment-line:rgba(216,139,162,.14); --bege:#CDB394; --bege-2:#3A2F2A; --marrom:#A88A95;
  --good:#5DBB8A; --good-bg:#14261C; --warn:#DDA95A; --warn-bg:#2B2215; --bad:#E5645C;
  --water:#7FA3C6; --track:rgba(239,233,235,.12);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151213; --surface:#1C1819; --raise:#272123; --seg-on:#332B2E;
  --ink:#EFE9EB; --ink2:#B5ABAF; --muted:#90868A;
  --line:rgba(239,233,235,.08); --line2:rgba(239,233,235,.16);
  --accent:#D88BA2; --accent-ink:#1E1115; --accent-soft:#33232A;
  --btn:#D88BA2; --btn-ink:#1E1115;
  --fill:#221D1F; --fill-line:rgba(239,233,235,.12);
  --moment:#271C21; --moment-line:rgba(216,139,162,.14); --bege:#CDB394; --bege-2:#3A2F2A; --marrom:#A88A95;
  --good:#5DBB8A; --good-bg:#14261C; --warn:#DDA95A; --warn-bg:#2B2215; --bad:#E5645C;
  --water:#7FA3C6; --track:rgba(239,233,235,.12);
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:0;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem;letter-spacing:-.01em}
h2{font-size:1.375rem}
h3{font-size:1.125rem}
p{margin:0}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.center{text-align:center}
.label{font-size:.8125rem;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.spread>*{min-width:0}
.spread.wrap{flex-wrap:wrap;row-gap:8px}
svg{flex:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:20px 0 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top .eyebrow{display:block;margin-bottom:4px}
main{display:flex;flex-direction:column;gap:16px;padding-bottom:8px}
.sec{padding-top:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:transparent}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:500;min-height:44px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.875rem;border-radius:8px}
.btn.sm.ghost{padding-inline:8px}
.btn:disabled{opacity:.45}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:disabled{color:var(--line2)}

.badge{font-family:var(--f-display);font-weight:500;display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 8px;border-radius:8px;background:var(--raise);color:var(--ink2);font-size:1rem;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--raise);border:0;color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.accent-t{color:var(--accent);font-weight:500}

/* boas-vindas */
.welcome{padding-top:40px;gap:24px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:64px;height:auto}
.wordmark{font-weight:500;font-size:.875rem;letter-spacing:.18em;text-transform:uppercase;color:var(--marrom);line-height:1.3}
.wordmark small{display:block;font-size:.6875rem;letter-spacing:.24em;color:var(--muted)}
.display{font-size:2.5rem;line-height:1.08;letter-spacing:-.015em}
.lead{font-size:1.0625rem;color:var(--ink2)}

/* momento 1: o cartão do dia */
.daycard{background:var(--moment);border:1px solid var(--moment-line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.dc-top{display:flex;align-items:center;gap:16px}
.dc-top .grow{flex:1;min-width:0}
.dc-lead{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;font-weight:500}
.dc-sub{color:var(--ink2);margin-top:4px}
.dc-mark{width:40px;height:auto;align-self:flex-start;opacity:.95}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .rt{stroke:var(--track)}
.ring .rp{stroke:var(--accent);stroke-linecap:round}
.rn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem;font-weight:500}
.rn small{font-size:.75rem;color:var(--muted);font-family:var(--f-body);margin-left:1px}
.rn{grid-auto-flow:column;place-content:center;align-items:baseline}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:10px;border:1px solid transparent;font-size:.75rem;color:var(--muted);background:transparent;cursor:pointer}
.day b{font-family:var(--f-display);font-weight:500;font-size:1.125rem;color:var(--ink);line-height:1;height:20px}
.day.today{color:var(--accent)}
.day.sel{border-color:var(--moment-line);background:var(--surface)}
.day.today.sel{border-color:var(--accent)}
.day b.full{color:var(--accent)}
.meter{width:60%;height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.water{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--moment-line);padding-top:16px}
.wseg{display:flex;gap:4px}
.wseg i{flex:1;height:8px;border-radius:4px;background:var(--track)}
.wseg i.on{background:var(--water)}
.wseg i.half{background:linear-gradient(90deg,var(--water) 50%,var(--track) 50%)}
.water .btn{background:var(--surface);border-color:var(--moment-line)}
.water .btn.ghost{background:transparent;border-color:transparent}

/* refeições */
.meal{display:flex;flex-direction:column;gap:12px}
.meal.next{border-color:var(--accent)}
.meal.done{background:transparent;box-shadow:none}
.meal.done h3{color:var(--muted)}
.meal-head{display:flex;gap:12px;align-items:center}
.meal-head .grow{flex:1;min-width:0}
.tick{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line2);background:var(--surface);display:grid;place-items:center;padding:0}
.tick svg{fill:var(--accent);opacity:0;transform:scale(.4)}
.tick[aria-pressed="true"]{border-color:transparent;background:var(--accent-soft)}
.tick[aria-pressed="true"] svg{opacity:1;transform:scale(1)}
.foods{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.food{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.food-check{flex:1;min-width:0;display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:0;background:transparent;padding:12px 0;min-height:48px}
.food-check .box{position:relative;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);background:var(--surface)}
.food.on .box{background:var(--ink);border-color:var(--ink)}
.food.on .box::after{content:"";position:absolute;left:5.5px;top:1.5px;width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg)}
.food.on .fname{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.fname{min-width:0;line-height:1.3}
.fname small,.fqty small,.eqv small{display:block;font-size:.75rem;color:var(--muted);text-decoration:none}
.fname small{color:var(--ink2)}
.fqty{text-align:right;font-weight:500;font-size:.875rem;line-height:1.25;max-width:9.5em}
.swap{flex:none;border:0;background:transparent;color:var(--ink2);font-weight:500;font-size:.8125rem;padding:0 0 0 12px;min-width:56px;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.ex-notes{font-size:.875rem;color:var(--ink2);background:var(--raise);border-radius:8px;padding:12px;line-height:1.5}
.opts{align-self:flex-start;max-width:100%;overflow-x:auto}
.reorder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.reorder li{display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.reorder li:last-child{border-bottom:0}
.reorder .grow{flex:1;min-width:0}

/* momento 2: os dois pratos */
.plates{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;padding:20px 16px;background:var(--moment);border:1px solid var(--moment-line);border-radius:20px}
.plate{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.dish{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:var(--surface);
  box-shadow:inset 0 0 0 10px var(--surface),inset 0 0 0 11px var(--moment-line),inset 0 0 0 56px var(--bege-2),0 1px 2px rgba(60,30,40,.08)}
.dish.alt{box-shadow:inset 0 0 0 10px var(--surface),inset 0 0 0 11px var(--moment-line),inset 0 0 0 56px var(--bege),0 1px 2px rgba(60,30,40,.08)}
.dish b{font-family:var(--f-display);font-weight:500;font-size:1.25rem;color:var(--marrom)}
:root[data-theme="dark"] .dish b{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dish.alt b{color:#2A1E1A}}
.plate figcaption{font-size:.875rem;line-height:1.3;color:var(--ink2);overflow-wrap:anywhere}
.eq{font-family:var(--f-display);font-size:1.75rem;color:var(--accent);line-height:112px}
.plates-note{grid-column:1/-1;text-align:center;color:var(--ink2)}

.eqlist{display:flex;flex-direction:column}
.eqrow{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:12px 0;min-height:48px;width:100%}
.eqrow:first-child{border-top:0}
.eqrow .grow{flex:1;min-width:0}
.eqv{font-weight:500;text-align:right;white-space:nowrap}
.eqrow.static .eqv{font-weight:500;white-space:normal}
.eqn{display:block}
.eqrow small{display:block;font-size:.75rem}
.up-k{color:var(--warn)}
.down-k{color:var(--good)}
.hint{font-size:.875rem;border-radius:8px;padding:8px 12px}
.hint.warn-b{background:var(--warn-bg);color:var(--warn)}

.seg{display:inline-flex;background:var(--raise);border:0;border-radius:10px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 16px;font-weight:500;color:var(--ink2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--accent);box-shadow:0 1px 2px rgba(60,30,40,.08),inset 0 0 0 1px var(--line)}
.seg.basis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%}
.basis button{padding:4px;font-size:.875rem}
.scope{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer}
.scope input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.scope small{display:block;color:var(--muted);font-size:.875rem;margin-top:4px}
.swapnow{display:flex;gap:12px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;flex-wrap:wrap}
.swapnow>div{min-width:0;flex:1}

textarea,.input,select{width:100%;border:1px solid var(--fill-line);background:var(--fill);border-radius:10px;padding:12px;font-size:1rem;min-height:48px}
select{appearance:auto;-webkit-appearance:menulist}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--ink2);font-weight:500}
label.f>*{color:var(--ink);font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}

details{border-top:1px solid var(--line);padding-top:12px}
details summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"";width:8px;height:8px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-2px,-2px)}
details[open] summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details>div{padding-top:8px}
.goals{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:.75rem;font-weight:500;color:var(--muted);min-height:48px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.12)}

@media (max-width:360px){.dish{width:96px;height:96px}.eq{line-height:96px}.display{font-size:2.125rem}}
@media (prefers-reduced-motion:no-preference){
  .btn,.tab,.seg button,.food-check .box,.tick,.swap,.day{transition:background-color 150ms var(--ease),color 150ms var(--ease),border-color 150ms var(--ease),transform 120ms var(--ease)}
  .tick svg{transition:opacity 160ms var(--ease),transform 260ms cubic-bezier(.34,1.56,.64,1)}
  .ring .rp{transition:stroke-dasharray 400ms var(--ease)}
  .btn:active,.tick:active{transform:scale(.97)}
}

html,body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<nav class="tabs" id="tabs" aria-label="Seções" hidden></nav>
<input type="file" id="dietFile" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="backupFile" accept=".json,application/json" hidden>
<script>
/* Leitura dos PDFs da nutricionista (plano alimentar + tabela de conversões).
   Funciona no navegador (pdf.js) e no Node (testes). Exporta via globalThis.SVDiet. */
(function (G) {
  "use strict";
  const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
  const fixLig = s => String(s).replace(/ﬁ/g, "fi").replace(/ﬂ/g, "fl").replace(/ﬀ/g, "ff");

  /* ---------- PDF -> linhas de células ---------- */
  async function pdfLines(doc) {
    const out = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      const items = tc.items.filter(it => it.str && it.str.trim()).map(it => ({
        s: fixLig(it.str), x: it.transform[4], y: it.transform[5], w: it.width, h: Math.abs(it.transform[3]) || it.height || 10
      }));
      items.sort((a, b) => b.y - a.y || a.x - b.x);
      const lines = [];
      for (const it of items) {
        const L = lines.find(l => Math.abs(l.y - it.y) <= Math.max(2.5, it.h * 0.35));
        if (L) L.items.push(it); else lines.push({ y: it.y, items: [it], page: p });
      }
      lines.sort((a, b) => b.y - a.y);
      for (const L of lines) {
        L.items.sort((a, b) => a.x - b.x);
        const cells = [];
        for (const it of L.items) {
          const c = cells[cells.length - 1];
          const gap = c ? it.x - (c.x + c.w) : Infinity;
          if (c && gap < it.h * 0.9) { c.s += (gap > it.h * 0.12 && !/\s$/.test(c.s) && !/^\s/.test(it.s) ? " " : "") + it.s; c.w = it.x + it.w - c.x; }
          else cells.push({ s: it.s, x: it.x, w: it.w, h: it.h });
        }
        cells.forEach(c => { c.s = c.s.replace(/\s+/g, " ").trim(); });
        const cl = cells.filter(c => c.s);
        if (cl.length) out.push({ page: p, y: L.y, cells: cl, text: cl.map(c => c.s).join(" ") });
      }
    }
    return out;
  }

  /* ---------- quantidades ---------- */
  function parseQty(q) {
    const s = String(q || "").trim();
    let m = /\((\d+(?:[.,]\d+)?)\s*(g|ml)\)/i.exec(s);
    const house = s.replace(/\s*\(\d+(?:[.,]\d+)?\s*(g|ml)\)\s*$/i, "").trim();

<script>
/* ============================================================
   Team Bruna Gripp — app do plano alimentar (local-first)
   Os dados ficam no aparelho (IndexedDB). Entrada: o PDF do plano da nutri.
   ============================================================ */
(function(){
"use strict";
const APP_VERSION = "1.0.0";
const DOW_SHORT = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const DOW_LONG = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

/* ---------- utils ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayStr = () => ymd(new Date());
const fmtDate = s => { const d = parseYmd(s); return DOW_SHORT[d.getDay()].toLowerCase()+" "+pad(d.getDate())+"/"+pad(d.getMonth()+1); };
const longDate = s => { const d = parseYmd(s); const w = DOW_LONG[d.getDay()]; return w.charAt(0).toUpperCase() + w.slice(1) + ", " + d.getDate() + " de " + MESES[d.getMonth()]; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; };
const numParse = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(",", ".").trim()); return Number.isFinite(n) ? n : null; };
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function parseDays(text){
  const t = norm(text); const days = [];
  const pats = [[0,/\bdom(ingo)?\b/],[1,/\bseg(unda)?\b/],[2,/\bter(ca)?\b/],[3,/\bqua(rta)?\b/],[4,/\bqui(nta)?\b/],[5,/\bsex(ta)?\b/],[6,/\bsab(ado)?\b/]];
  pats.forEach(([d,re]) => { if (re.test(t)) days.push(d); });
  return days;
}

/* ---------- storage: IndexedDB (+ localStorage fallback) ---------- */
const local = (() => {
  let dbp = null;
  function open(){ if (dbp) return dbp; dbp = new Promise((res, rej) => { try { const r = indexedDB.open("team-bruna-gripp", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); return dbp; }
  async function get(k){ try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => rej(q.error); }); } catch(e){ try { const v = localStorage.getItem("tbg:"+k); return v ? JSON.parse(v) : null; } catch(_) { return null; } } }
  async function set(k, v){ try { const db = await open(); await new Promise((res, rej) => { const tx = db.transaction("kv","readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch(e){ try { localStorage.setItem("tbg:"+k, JSON.stringify(v)); } catch(_){} } }
  return { get, set };
})();

let S = null;
const UI = { tab: "hoje", view: null };
let saveTimer = null;
function blankState(){ return { v:1, updatedAt:0, diet:null, dietDays:{}, customFoods:[], foodEdits:{} }; }
function persist(){ S.updatedAt = Date.now(); clearTimeout(saveTimer); saveTimer = setTimeout(() => local.set("state", S), 300); }

/* ---------- icons: um conjunto de traço ---------- */
const ICO = (d, w = 18) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {

const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){ return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src && s.dataset.ok)) return res(); const s = document.createElement("script"); s.src = src; s.onload = () => { s.dataset.ok = "1"; res(); }; s.onerror = () => rej(new Error("não consegui carregar o leitor de PDF. Confira a internet e tente de novo.")); document.head.appendChild(s); }); }

const D = () => S.diet || null;

const mealKey = m => norm(m.name);

function dayRO(date){ return (S.dietDays && S.dietDays[date]) || { order: null, done: {}, items: {}, opt: {}, swaps: {}, water: 0 }; }
function dayRW(date){ S.dietDays = S.dietDays || {}; return S.dietDays[date] || (S.dietDays[date] = { order: null, done: {}, items: {}, opt: {}, swaps: {}, water: 0 }); }
function mealOrder(date){
  const plan = DP(); if (!plan) return [];
  const keys = plan.meals.map(mealKey);
  const base = dayRO(date).order || (D().order && D().order.length ? D().order : keys);
  const out = base.filter(k => keys.includes(k)); keys.forEach(k => { if (!out.includes(k)) out.push(k); });
  return out.filter(k => mealOnDay(k, date));
}
const mealDays = m => parseDays(m.name);

function dayStats(date){ if (!DP()) return { done: 0, total: 0 }; const d = dayRO(date); const ks = mealOrder(date); return { done: ks.filter(k => d.done[k]).length, total: ks.length }; }

async function handleDietFiles(files){
  const msgs = [];
  try {
    toast("Lendo " + (files.length > 1 ? files.length + " PDFs…" : "o PDF…"));
    const lib = await getPdfjs();
    for (const f of files) {
      const doc = await lib.getDocument({ data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false }).promise;
      const lines = await SVDiet.pdfLines(doc);
      S.diet = S.diet || {};
      if (SVDiet.isPlan(lines)) {
        const plan = SVDiet.parsePlan(lines);
        if (!plan.meals.length) { msgs.push(`${f.name}: não achei refeições`); continue; }
        const keys = plan.meals.map(mealKey);
        const oldKeys = S.diet.plan ? S.diet.plan.meals.map(mealKey) : [];
        const same = oldKeys.length === keys.length && keys.every(k => oldKeys.includes(k));
        const prevOrder = same ? (S.diet.order || []).filter(k => keys.includes(k)) : [];
        S.diet.plan = plan; S.diet.planFile = f.name; S.diet.planAt = Date.now();
        S.diet.order = prevOrder.concat(keys.filter(k => !prevOrder.includes(k)));
        msgs.push(`plano com ${plan.meals.length} refeições`);
      } else if (SVDiet.isConversion(lines)) {
        const conv = SVDiet.parseConversion(lines);
        if (!conv.groups.length) { msgs.push(`${f.name}: não achei a tabela`); continue; }
        S.diet.conv = conv; S.diet.convFile = f.name; S.diet.convAt = Date.now();
        msgs.push(`tabela com ${conv.groups.reduce((a, g) => a + g.foods.length + 1, 0)} alimentos`);
      } else msgs.push(`${f.name}: não reconheci este PDF`);
    }
    persist(); UI.tab = "hoje"; UI.view = null; render(); window.scrollTo(0, 0);
    toast("Importado: " + msgs.join(" · "));
  } catch(e){ console.error(e); toast("Não consegui ler o PDF: " + (e.message || e)); }
}

/* ---------- tabela nativa (TACO) e conversões ---------- */
const FD = () => window.SV_FOODS || { foods: [], groups: {} };
const BASIS_LABEL = { p: "proteína", c: "carboidrato", l: "gordura", k: "calorias" };
const UNIT_PL = { "ovo": "ovos", "clara": "claras", "gema": "gemas", "fatia": "fatias", "pão": "pães", "dose": "doses", "colher de sopa cheia": "colheres de sopa cheias", "concha cheia": "conchas cheias", "colher de sopa": "colheres de sopa", "unidade": "unidades" };
const NSTOP = new Set(["de", "da", "do", "das", "dos", "e", "com", "sem", "em", "no", "na", "a", "o", "ao"]);
const ntoks = s => norm(s).replace(/[^a-z0-9 ]/g, " ").split(" ").filter(w => w && !NSTOP.has(w)).map(w => w.length > 3 ? w.replace(/s$/, "") : w);
function allFoods(){ const ed = S.foodEdits || {}; return FD().foods.map(f => ed[f.id] ? Object.assign({}, f, ed[f.id], { edited: true }) : f).concat(S.customFoods || []); }
const foodById = id => allFoods().find(f => f.id === id) || null;
function matchFood(name){
  const it = ntoks(name); let best = null;
  for (const f of allFoods()) for (const cand of [f.n].concat(f.a || [])) {
    const ft = ntoks(cand); if (!ft.length || !ft.every(w => it.includes(w))) continue;
    const score = ft.length * 10 + (f.custom ? 5 : 0);
    if (!best || score > best.score) best = { score, f };
  }
  return best ? best.f : null;
}
const roundG = a => a >= 100 ? Math.round(a / 5) * 5 : a >= 20 ? Math.round(a) : Math.round(a * 2) / 2;
const num1 = x => String(Math.round(x * 10) / 10).replace(".", ",");
const unitOf = f => /leite (desnatado|integral)|suco/i.test(f.n) ? "ml" : "g";
function unitHint(f, grams){ if (!f.u || !grams) return ""; const n = Math.round(grams / f.u[0] * 2) / 2; if (n < 0.5) return ""; return "≈ " + num1(n) + " " + (n > 1 ? (UNIT_PL[f.u[1]] || f.u[1] + "s") : f.u[1]); }
const groupBasis = g => (FD().groups[g] || {}).basis || "k";
const groupLabel = g => (FD().groups[g] || {}).label || (g === "seu" ? "Seus alimentos" : g);
function convertTo(src, grams, dst, basis){
  const need = src[basis] * grams / 100; const per = dst[basis]; const min = basis === "k" ? 10 : 1;
  if (!per || per < min || need <= 0) return null;
  const g = need / per * 100; if (g > 1500) return null;
  const r = roundG(g); const kcal = Math.round(r * dst.k / 100);
  return { g: r, kcal, d: kcal - Math.round(grams * src.k / 100) };
}
const portion = (f, g) => ({ k: Math.round(f.k * g / 100), p: Math.round(f.p * g / 10) / 10, c: Math.round(f.c * g / 10) / 10, l: Math.round(f.l * g / 10) / 10 });
const macroLine = (f, g) => { const x = portion(f, g); return `${x.k} kcal · P ${num1(x.p)} g · C ${num1(x.c)} g · G ${num1(x.l)} g`; };
const srcTag = f => f.custom ? '<span class="pill accent">seu</span>' : f.src === "rotulo" ? `<span class="pill">rótulo${f.edited ? ", ajustado" : ""}</span>` : (f.edited ? '<span class="pill">ajustado</span>' : "");

/* trocas: padrão daqui em diante (S.diet.swaps) ou só no dia (dietDays[d].swaps) */
const swapKey = (k, o, name) => k + "|" + o + "|" + norm(name);
function permanentFor(sk, date){ const list = ((S.diet && S.diet.swaps) || {})[sk] || []; let e = null; for (const x of list) if (x.since <= date && (!e || x.since >= e.since)) e = x; return e && !e.revert ? e : null; }
function setPermanent(sk, date, entry){ S.diet.swaps = S.diet.swaps || {}; const list = (S.diet.swaps[sk] || []).filter(e => e.since < date); list.push(Object.assign({ since: date }, entry)); S.diet.swaps[sk] = list; }
function effectiveSwap(date, k, o, i){
  const it = mealBy(k).options[o].items[i]; const sk = swapKey(k, o, it.name); const day = dayRO(date).swaps || {};
  const d1 = day[sk] || day[itemKey(k, o, i)];
  if (d1) return d1.revert ? null : Object.assign({ scope: "dia" }, d1);
  const p = permanentFor(sk, date); return p ? Object.assign({ scope: "padrao" }, p) : null;
}

function bestEquiv(src, grams, basis){
  const g = src.g === "fruta" && basis === "c" ? "fruta" : src.g === "seu" ? null : src.g;
  for (const f of allFoods()) { if (f.id === src.id || f.g !== g) continue; const r = convertTo(src, grams, f, basis); if (r) return { f, r }; }
  return null;
}
function equivRows(src, grams, basis, mode){
  const defGroups = src.g === "fruta" && basis === "c" ? ["fruta", "carb"] : src.g === "carb" && basis === "c" ? ["carb", "fruta"] : [src.g === "seu" ? null : src.g];
  const rows = allFoods().filter(f => f.id !== src.id).map(f => ({ f, r: convertTo(src, grams, f, basis) })).filter(x => x.r);
  rows.sort((a, b) => { const ia = defGroups.indexOf(a.f.g), ib = defGroups.indexOf(b.f.g); return (ia < 0 ? 9 : ia) - (ib < 0 ? 9 : ib); });
  return rows.map(({ f, r }) => {
    const def = defGroups.includes(f.g) || (f.custom && groupBasis(f.g) === basis);
    const tag = mode === "swap" ? "button" : "div";

function basisChips(cur, def){ return `<div class="seg basis" role="group" aria-label="Igualar por">${["p", "c", "l", "k"].map(b => `<button data-act="basis" data-b="${b}" aria-pressed="${b === cur}">${({ p: "Proteína", c: "Carbo", l: "Gordura", k: "Calorias" })[b]}</button>`).join("")}</div>`; }

function saveFoodForm(form){

function commitSwap(date, entry){
  const { k, o, i, onlyToday } = UI.swap; const it = mealBy(k).options[o].items[i]; const sk = swapKey(k, o, it.name); const d = dayRW(date);

function dietAct(act, b){
  const date = dietDate();
  switch (act) {
    case "diet-import": $("#dietFile").value = ""; $("#dietFile").click(); return true;
    case "diet-day": { const d = parseYmd(date); d.setDate(d.getDate() + (+b.dataset.d)); const ds = ymd(d); UI.dietDate = ds >= todayStr() ? null : ds; UI.keepScroll = false; render(); return true; }
    case "diet-goto": UI.dietDate = b.dataset.date >= todayStr() ? null : b.dataset.date; if (b.dataset.date > todayStr()) return true; render(); return true;
    case "meal-done": { const k = b.dataset.k; const d = dayRW(date === todayStr() || UI.tab === "hoje" ? date : todayStr()); const m = mealBy(k); const o = chosenOpt(date, k);
      if (d.done[k]) { delete d.done[k]; } else { d.done[k] = Date.now(); m.options[o].items.forEach((_, i) => { d.items[itemKey(k, o, i)] = true; }); }
      persist(); UI.keepScroll = true; render(); return true; }
    case "food": { const { k } = b.dataset, o = +b.dataset.o, i = +b.dataset.i; const d = dayRW(date); const ik = itemKey(k, o, i);
      if (d.items[ik]) delete d.items[ik]; else d.items[ik] = true;
      const pr = mealProgress(date, k); if (pr.n === pr.total) { if (!d.done[k]) d.done[k] = Date.now(); } else delete d.done[k];
      persist(); UI.keepScroll = true; render(); return true; }
    case "meal-opt": { const d = dayRW(date); d.opt[b.dataset.k] = +b.dataset.o; if (date >= todayStr()) { const od = D().optDefault = D().optDefault || {}; const k = b.dataset.k; const list = (Array.isArray(od[k]) ? od[k] : []).filter(x => x.since < date); list.push({ since: date, o: +b.dataset.o }); od[k] = list; } persist(); UI.keepScroll = true; render(); return true; }
    case "swap-open": UI.swap = { k: b.dataset.k, o: +b.dataset.o, i: +b.dataset.i, basis: null, onlyToday: false }; UI.swapReturnY = window.scrollY; UI.view = "swap"; render(); window.scrollTo(0, 0); return true;
    case "swap-close": UI.view = null; render(); window.scrollTo(0, UI.swapReturnY || 0); return true;
    case "basis": if (!UI.view && UI.tab === "trocas") UI.convState.basis = b.dataset.b; else UI.swap.basis = b.dataset.b; UI.keepScroll = true; render(); return true;
    case "swap-apply": { const f = foodById(b.dataset.id); const g = +b.dataset.g; const u = unitOf(f); commitSwap(date, { name: f.n, qty: fmtAmt(g, u), amount: g, unit: u, house: unitHint(f, g), foodId: f.id, from: "tabela" }); return true; }
    case "swap-apply-raw": { const q = SVDiet.parseQty(b.dataset.qty); commitSwap(date, Object.assign({ name: b.dataset.name, qty: b.dataset.qty, from: "nutri" }, q)); return true; }
    case "swap-reset": { const { k, o, i } = UI.swap; const it = mealBy(k).options[o].items[i]; const sk = swapKey(k, o, it.name); const d = dayRW(date);
      if (d.swaps[sk] || d.swaps[itemKey(k, o, i)]) { delete d.swaps[sk]; delete d.swaps[itemKey(k, o, i)]; }
      if (permanentFor(sk, date)) setPermanent(sk, date, { revert: true });
      persist(); UI.keepScroll = true; render(); toast("De volta ao alimento do plano"); return true; }
    case "conv-open": UI.view = "conv"; UI.convReturnY = window.scrollY; render(); window.scrollTo(0, 0); return true;
    case "conv-close": UI.view = null; render(); window.scrollTo(0, UI.convReturnY || 0); return true;
    case "food-new": UI.foodReturn = UI.view; UI.foodEdit = { id: null, name: b.dataset.name || "", alias: b.dataset.name ? norm(b.dataset.name) : "" }; UI.foodErr = null; UI.view = "food"; render(); window.scrollTo(0, 0); return true;
    case "food-edit": UI.foodReturn = UI.view; UI.foodEdit = { id: b.dataset.id }; UI.foodErr = null; UI.view = "food"; render(); window.scrollTo(0, 0); return true;
    case "food-cancel": UI.view = UI.foodReturn || null; UI.foodErr = null; render(); return true;
    case "food-restore": if (S.foodEdits) delete S.foodEdits[b.dataset.id]; persist(); UI.view = UI.foodReturn || null; render(); toast("Valores originais de volta"); return true;
    case "food-del": S.customFoods = (S.customFoods || []).filter(x => x.id !== b.dataset.id); persist(); UI.view = UI.foodReturn || null; render(); return true;
    case "water": { const d = dayRW(date); d.water = Math.max(0, (d.water || 0) + (+b.dataset.ml)); persist(); UI.keepScroll = true; render(); return true; }
    case "diet-reorder": UI.dietReorder = !UI.dietReorder; render(); return true;
    case "meal-move": { const d = dayRW(date); const ord = mealOrder(date); const i = ord.indexOf(b.dataset.k), j = i + (+b.dataset.d); if (j < 0 || j >= ord.length) return true; [ord[i], ord[j]] = [ord[j], ord[i]]; d.order = ord; persist(); UI.keepScroll = true; render(); return true; }
    case "order-default": S.diet.order = mealOrder(date); Object.keys(S.dietDays || {}).forEach(ds => { if (ds >= todayStr()) S.dietDays[ds].order = null; }); persist(); toast("Ordem salva como padrão"); render(); return true;
    case "order-reset": { const keys = DP().meals.map(mealKey); S.diet.order = keys; const d = dayRW(date); d.order = null; persist(); UI.keepScroll = true; render(); return true; }
  }
  return false;
}



/* ---------- arquivos ---------- */
async function offerFile(blob, filename){
  try { const file = new File([blob], filename, { type: blob.type }); if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; } }
  catch(e){ if (e && e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function restoreBackup(file){
  try { const data = JSON.parse(await file.text()); if (data.app !== "team-bruna-gripp" || !data.state) throw new Error("este arquivo não é um backup do app");
    S = Object.assign(blankState(), data.state); persist(); UI.tab = "hoje"; UI.view = null; render(); toast("Backup restaurado"); }
  catch(e){ toast("Não consegui restaurar: " + (e.message || e)); }
}

  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (act === "conv-open") return go(() => { UI.tab = "trocas"; UI.view = null; });
  if (act === "conv-close") return go(() => { UI.tab = "hoje"; UI.view = null; });
  if (act === "food-cancel" || act === "food-restore" || act === "food-del") { if (UI.foodReturn === "conv") UI.foodReturn = null; }
  if (dietAct(act, b)) return;
  switch (act) {
    case "tab": go(() => { UI.tab = b.dataset.tab; UI.view = null; UI.dietReorder = false; if (b.dataset.tab !== "hoje") UI.dietDate = null; }); break;
    case "backup": { const data = JSON.stringify({ app: "team-bruna-gripp", version: APP_VERSION, exportedAt: new Date().toISOString(), state: S }); await offerFile(new Blob([data], { type: "application/json" }), `team-bruna-gripp-backup-${todayStr()}.json`); break; }
    case "restore": $("#backupFile").value = ""; $("#backupFile").click(); break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "swapq") { const q = norm(el.value); document.querySelectorAll(".eqlist [data-search]").forEach(r => { r.hidden = q ? !r.dataset.search.includes(q) : r.dataset.def !== "1"; }); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.id === "dietFile" && el.files.length) handleDietFiles([...el.files]);
  if (el.id === "backupFile" && el.files[0]) restoreBackup(el.files[0]);
  if (el.dataset.sw === "today" && UI.swap) { UI.swap.onlyToday = el.checked; return; }
  if (el.dataset.conv === "id") { UI.convState.id = el.value; UI.convState.basis = null; UI.keepScroll = true; render(); return; }
  if (el.dataset.conv === "g") { const g = numParse(el.value); if (g > 0) { UI.convState.g = g; UI.keepScroll = true; render(); } return; }
});
document.addEventListener("submit", ev => { if (ev.target.id === "foodForm") { ev.preventDefault(); saveFoodForm(ev.target); } });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && S) local.set("state", S); });

async function boot(){
  S = Object.assign(blankState(), (await local.get("state")) || {});
  render();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
window.TBG = { get state(){ return S; }, render };
boot();
})();
</script>
